<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tiles and Glass Buttons</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #11151d;
      color: #f4f7fb;
      font-family: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .tile {
      position: absolute;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      transition: background-image 250ms linear;
    }

    .center-card {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 240px;
      margin-left: -120px;
      margin-top: -104px;
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      background: rgba(10, 14, 22, 0.32);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .glass-btn {
      display: block;
      width: 100%;
      margin: 0 0 14px 0;
      padding: 16px 18px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 18px;
      color: #f4f7fb;
      background: linear-gradient(180deg, rgba(255,255,255,0.26), rgba(255,255,255,0.10));
      font-size: 16px;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 10px 24px rgba(0, 0, 0, 0.22);
      position: relative;
      top: 0;
    }

    .glass-btn:last-child {
      margin-bottom: 0;
    }

    .glass-btn:focus {
      outline: none;
      color: #efefef;
      border-color: #d2d2ef;
      background: #434343;
    }
  </style>
</head>
<body>
  <div class="scene" id="scene">
    <div id="tilesLayer"></div>

    <div class="center-card">
      <button class="glass-btn" id="btn1" tabindex="0" onclick="firebolt_discovery('shellbluetoothoverlay')">BT Settings Firebolt (Shell)</button>
      <button class="glass-btn" id="btn2" tabindex="1" onclick="firebolt_discovery('xrebluetoothoverlay')">BT Settings Firebolt (XRE)</button>
      <button class="glass-btn" id="btn3" tabindex="2" onclick="$badger.deeplink('xre:///guide/x2/settings/audio/bluetooth.xml')">BT Settings Badger</button>
    </div>
  </div>

  <script>
    (function () {
      var scene = document.getElementById('scene');
      var layer = document.getElementById('tilesLayer');
      var tiles = [];
      var tileCount = 40;
      var start = new Date().getTime();
      var baseHue = Math.random() * 360;
      var drift = 22 + Math.random() * 28;
      var satBase = 28 + Math.random() * 18;
      var lightBase = 18 + Math.random() * 8;
      var raf = window.requestAnimationFrame || function (cb) {
        return window.setTimeout(function () {
          cb(new Date().getTime());
        }, 16);
      };

      function hsl(h, s, l) {
        return 'hsl(' + h + 'deg ' + s + '% ' + l + '%)';
      }

      function makeTiles() {
        var i;
        for (i = 0; i < tileCount; i++) {
          var tile = document.createElement('div');
          tile.className = 'tile';
          layer.appendChild(tile);
          tiles.push(tile);
        }
      }

      function layoutTiles() {
        var width = scene.clientWidth;
        var height = scene.clientHeight;
        var cols = width < 700 ? 4 : 8;
        var rows = 5;
        var gap = 1;
        var pad = 1;
        var innerW = width - (pad * 2) - (gap * (cols - 1));
        var innerH = height - (pad * 2) - (gap * (rows - 1));
        var tileW = Math.floor(innerW / cols);
        var tileH = Math.floor(innerH / rows);
        var i;

        for (i = 0; i < tiles.length; i++) {
          var col = i % cols;
          var row = Math.floor(i / cols) % rows;
          tiles[i].style.left = (pad + col * (tileW + gap)) + 'px';
          tiles[i].style.top = (pad + row * (tileH + gap)) + 'px';
          tiles[i].style.width = tileW + 'px';
          tiles[i].style.height = tileH + 'px';
        }
      }

      function animate(now) {
        var t = (now - start) / 1000;
        var hueA = (baseHue + Math.sin(t * 0.55) * drift) % 360;
        var hueB = (baseHue + 26 + Math.cos(t * 0.7) * drift) % 360;
        var satA = satBase + Math.sin(t * 0.4) * 4;
        var satB = satBase + 5 + Math.cos(t * 0.45) * 4;
        var lightA = lightBase + Math.sin(t * 0.6) * 4;
        var lightB = lightBase + 5 + Math.cos(t * 0.5) * 4;
        var i;

        for (i = 0; i < tiles.length; i++) {
          var odd = i % 2 === 0;
          var top = odd ? hsl(hueA, satA, lightA) : hsl(hueB, satB, lightB);
          var bottom = odd ? hsl((hueA + 12) % 360, satA - 2, lightA - 4) : hsl((hueB + 12) % 360, satB - 2, lightB - 4);
          tiles[i].style.backgroundImage = 'linear-gradient(145deg, ' + top + ', ' + bottom + ')';
        }

        raf(animate);
      }

      makeTiles();
      layoutTiles();
      raf(animate);

      if (window.addEventListener) {
        window.addEventListener('resize', layoutTiles);
      } else if (window.attachEvent) {
        window.attachEvent('onresize', layoutTiles);
      }
    })();
  </script>
  <script>
    // Set focus to the first button on page load
    window.onload = function() {
      document.getElementById('btn1').focus();
    }

    const buttons = Array.from(document.querySelectorAll('.glass-btn'));
    buttons.forEach((btn, idx) => {
      btn.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          btn.click();
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          const next = buttons[(idx + 1) % buttons.length];
          next.focus();
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          const prev = buttons[(idx - 1 + buttons.length) % buttons.length];
          prev.focus();
        }
      });
    });
  </script>
  <script src="https://cdn.thor.comcast.com/sdk/money-badger.min.js"></script>
  <script src="./dist/bundle.js"></script>
</body>
</html>
