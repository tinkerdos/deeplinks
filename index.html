<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tiles and Glass Buttons</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #11151d;
      color: #f4f7fb;
      font-family: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .tile {
      position: absolute;
      transition: background-color 1400ms ease-in-out, opacity 1400ms ease-in-out;
      background-image: linear-gradient(145deg, rgba(255, 255, 255, 0.10), rgba(0, 0, 0, 0.18));
      will-change: background-color, opacity;
    }

    .center-card {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 240px;
      margin-left: -120px;
      margin-top: -104px;
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      background: rgba(10, 14, 22, 0.32);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .glass-btn {
      display: block;
      width: 100%;
      margin: 0 0 14px 0;
      padding: 16px 18px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 18px;
      color: #f4f7fb;
      background: linear-gradient(180deg, rgba(255,255,255,0.26), rgba(255,255,255,0.10));
      font-size: 16px;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 10px 24px rgba(0, 0, 0, 0.22);
      position: relative;
      top: 0;
    }

    .glass-btn:last-child {
      margin-bottom: 0;
    }

    .glass-btn:focus {
      outline: none;
      color: #efefef;
      border-color: #d2d2ef;
      background: #434343;
    }
  </style>
</head>
<body>
  <div class="scene" id="scene">
    <div id="tilesLayer"></div>

    <div class="center-card">
      <button class="glass-btn" id="btn1" tabindex="0" onclick="firebolt_discovery('shellbluetoothoverlay')">Bluetooth Shell</button>
      <button class="glass-btn" id="btn2" tabindex="1" onclick="firebolt_discovery('xrebluetoothoverlay')">Bluetooth Guide</button>
      <button class="glass-btn" id="btn3" tabindex="2" onclick="$badger.deeplink('xre:///guide/x2/settings/audio/bluetooth.xml')">Bluetooth Badger</button>
    </div>
  </div>

  <script>
    (function () {
      var scene = document.getElementById('scene');
      var layer = document.getElementById('tilesLayer');
      var tiles = [];
      var tileCount = 180;

      function gray(light) {
        return 'hsl(0deg 0% ' + light + '%)';
      }

      function applyTileShade(tile, light) {
        tile.style.backgroundColor = gray(light);
      }

      function applyTileOpacity(tile, opacity) {
        tile.style.opacity = opacity;
      }

      function scheduleTileShadeChange(tile, index) {
        var delay = 500 + Math.random() * (index % 3 === 0 ? 2200 : 3800);

        tileTimers[index] = window.setTimeout(function () {
          var state = tileStates[index];
          var lightDelta = (Math.random() * 8) - 4;
          var opacityDelta = (Math.random() * 0.12) - 0.06;
          var light = Math.max(10, Math.min(58, state.light + lightDelta));

          state.light = light;
          state.opacity = opacity;
          applyTileShade(tile, state.light);
          applyTileOpacity(tile, state.opacity);
          scheduleTileShadeChange(tile, index);
        }, delay);
      }

      function makeTiles() {
        var i;
        for (i = 0; i < tileCount; i++) {
          var tile = document.createElement('div');
          tile.className = 'tile';
          layer.appendChild(tile);
          tiles.push(tile);

          tileStates.push({
            light: 12 + ((i % 36) * 1.1) + Math.random() * 2,
            opacity: 0.78 + Math.random() * 0.22
          });
          applyTileShade(tile, tileStates[i].light);
          applyTileOpacity(tile, tileStates[i].opacity);
          scheduleTileShadeChange(tile, i);
        }
      }

      function layoutTiles() {
        var width = scene.clientWidth;
        var height = scene.clientHeight;
        var targetTileSize = width < 700 ? 46 : 72;
        var cols = Math.max(1, Math.ceil(width / targetTileSize));
        var rows = Math.ceil(tileCount / cols);
        var gap = 0; //width < 700 ? 10 : 14;
        var pad = 0; //width < 700 ? 14 : 24;
        var innerW = width - (pad * 2) - (gap * (cols - 1));
        var innerH = height - (pad * 2) - (gap * (rows - 1));
        var tileW = Math.floor(innerW / cols);
        var tileH = Math.floor(innerH / rows);
        var i;

        for (i = 0; i < tiles.length; i++) {
          var col = i % cols;
          var row = Math.floor(i / cols) % rows;
          tiles[i].style.left = (pad + col * (tileW + gap)) + 'px';
          tiles[i].style.top = (pad + row * (tileH + gap)) + 'px';
          tiles[i].style.width = tileW + 'px';
          tiles[i].style.height = tileH + 'px';
        }
      }

      makeTiles();
      layoutTiles();

      if (window.addEventListener) {
        window.addEventListener('resize', layoutTiles);
      } else if (window.attachEvent) {
        window.attachEvent('onresize', layoutTiles);
      }
    })();
  </script>
  <script>
    // Set focus to the first button on page load
    window.onload = function() {
      document.getElementById('btn1').focus();
    }

    const buttons = Array.from(document.querySelectorAll('.glass-btn'));
    buttons.forEach((btn, idx) => {
      btn.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          btn.click();
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          const next = buttons[(idx + 1) % buttons.length];
          next.focus();
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          const prev = buttons[(idx - 1 + buttons.length) % buttons.length];
          prev.focus();
        }
      });
    });
  </script>
  <script src="https://cdn.thor.comcast.com/sdk/money-badger.min.js"></script>
  <script src="./dist/bundle.js"></script>
</body>
</html>
