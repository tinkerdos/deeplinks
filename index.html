<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Button Alert App</title>
  <style>
    
    html {
      height: 100vh;
      margin: 0;
      display: flex;
      font-family: sans-serif;
      align-items: center;
      justify-content: center;
    }
    body {
  background-image: 
    linear-gradient(45deg, #eee 25%, transparent 25%), 
    linear-gradient(-45deg, #eee 25%, transparent 25%), 
    linear-gradient(45deg, transparent 75%, #eee 75%), 
    linear-gradient(-45deg, transparent 75%, #eee 75%);
  background-size: 360px 360px;
  background-position: 0 0, 0 180px, 180px -180px, -180px 0px;
  background-color: #222;
}
    .container {
      display: flex;
      flex-direction: column; /* change to column for up/down navigation */
      gap: 2rem;
      align-items: center;
    }
    button {
      padding: 1rem 2rem;
      font-size: 1.2rem;
      cursor: pointer;
      border-radius: 8px;
      border: 2px solid #666;
      background: #fff;
      transition: background 0.2s, border 0.2s;
    }
    button:focus {
      outline: none;
      border-color: #d276d2;
      background: #e3f0ff;
    }
    button:hover {
      background: #f0f0f0;
    }
  </style>
  </head>
<body>
  <div class="container">
    <button id="btn1" tabindex="0" onclick="firebolt_discovery('shellbluetoothoverlay')">BT Settings Firebolt (Shell)</button>
    <button id="btn2" tabindex="1" onclick="firebolt_discovery('xrebluetoothoverlay')">BT Settings Firebolt (XRE)</button>
    <button id="btn3" tabindex="2" onclick="$badger.deeplink('xre:///guide/x2/settings/audio/bluetooth.xml')">BT Settings Badger</button>
  </div>
  <script>
    
    // Set focus to the first button on page load
    window.onload = function() {
      document.getElementById('btn1').focus();
    }

    const buttons = Array.from(document.querySelectorAll('button'));
    buttons.forEach((btn, idx) => {
      btn.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          btn.click();
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          const next = buttons[(idx + 1) % buttons.length];
          next.focus();
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          const prev = buttons[(idx - 1 + buttons.length) % buttons.length];
          prev.focus();
        }
      });
    });
  </script>
  <script src="https://cdn.thor.comcast.com/sdk/money-badger.min.js"></script>
  <script src="./dist/bundle.js"></script>
</body>
</html>
